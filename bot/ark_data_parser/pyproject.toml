[build-system]
requires = ["setuptools<70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ark-asa-data-parser"
version = "0.1.0"
description = "Python library for parsing ARK: Survival Ascended save files"
readme = "README.md"
authors = [
    {name = "BoldPhoenix", email = "boldphoenix@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["ark", "survival", "ascended", "save", "parser", "game", "data"]
requires-python = ">=3.10"
dependencies = [
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/BoldPhoenix/ArkDiscordBot"
Documentation = "https://github.com/BoldPhoenix/ArkDiscordBot/wiki"
Repository = "https://github.com/BoldPhoenix/ArkDiscordBot"
"Bug Tracker" = "https://github.com/BoldPhoenix/ArkDiscordBot/issues"

[tool.setuptools]
packages = ["ark_asa_parser"]
package-dir = {"ark_asa_parser" = "."}

[tool.setuptools.package-data]
"bot.ark_data_parser" = ["*.md", "py.typed"]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
